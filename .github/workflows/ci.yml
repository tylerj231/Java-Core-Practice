name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Every started exercise has tests
        run: ./scripts/check-tests.sh

      - name: Build and run all tests
        run: mvn -B verify
